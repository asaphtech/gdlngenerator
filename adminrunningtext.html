<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Master Control</title>
    <style>
        :root { --primary: #3ecf8e; --bg-dark: #0a0a0a; --card-bg: #1a1a1a; --border: #333; --danger: #ff4d4d; --text-muted: #888; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: white; margin: 0; padding: 20px; }
        
        .main-layout { display: grid; grid-template-columns: 320px 1fr 350px; gap: 20px; max-width: 1600px; margin: 0 auto; align-items: start; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-sizing: border-box; }
        
        h2 { font-size: 1rem; color: var(--primary); margin: 0 0 15px 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Bank Status List */
        .bank-grid { display: flex; flex-direction: column; gap: 8px; max-height: 75vh; overflow-y: auto; padding-right: 5px; }
        .bank-row { display: flex; align-items: center; justify-content: space-between; background: #222; padding: 8px 10px; border-radius: 8px; border: 1px solid #333; }
        .bank-name { font-size: 0.75rem; font-weight: bold; width: 70px; }
        .st-group { display: flex; gap: 3px; }
        .st-btn { border: none; padding: 4px 6px; border-radius: 4px; font-size: 0.6rem; font-weight: bold; cursor: pointer; opacity: 0.3; color: #000; }
        .st-btn.active { opacity: 1; transform: scale(1.05); }
        .btn-on { background: var(--primary); }
        .btn-off { background: #7f8c8d; color: #fff; }
        .btn-ggn { background: var(--danger); }
        .btn-qris { background: #00d2ff; }

        /* Editor */
        textarea { width: 100%; height: 220px; background: #000; border: 1px solid var(--border); border-radius: 8px; color: white; padding: 15px; resize: none; margin-bottom: 15px; font-size: 1rem; line-height: 1.5; }
        .main-btn { width: 100%; background: var(--primary); border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .main-btn:hover { opacity: 0.9; }

        /* Template List */
        .temp-item { background: #222; border: 1px solid var(--border); padding: 12px; border-radius: 10px; margin-bottom: 10px; position: relative; }
        .temp-click { cursor: pointer; padding-right: 50px; }
        .temp-click b { display: block; color: var(--primary); font-size: 0.85rem; margin-bottom: 4px; }
        .temp-click p { margin: 0; font-size: 0.75rem; color: #aaa; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; }
        .temp-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
        .btn-icon { background: none; border: none; cursor: pointer; font-size: 0.9rem; padding: 2px; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 400px; border: 1px solid var(--border); }
        .modal input, .modal textarea { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 10px; margin-bottom: 15px; box-sizing: border-box; }

        @media (max-width: 1100px) { .main-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="main-layout">
    
    <div class="card">
        <h2>🏦 Bank Status</h2>
        <div id="bankList" class="bank-grid"></div>
        <button class="main-btn" style="margin-top:15px; background:#333; color:white;" onclick="generateText()">Generate From Status ↓</button>
    </div>

    <div class="card">
        <h2>✏️ Marquee Editor</h2>
        <textarea id="marqueeInput"></textarea>
        <button class="main-btn" onclick="updateLive()">Update Running Text Sekarang</button>
        <div id="statusLog" style="text-align:center; margin-top:10px; font-size:0.8rem;"></div>
    </div>

    <div class="card">
        <h2>
            📋 Templates 
            <button onclick="openModal()" style="background:var(--primary); border:none; border-radius:4px; font-size:0.7rem; cursor:pointer; padding:2px 8px;">+ New</button>
        </h2>
        <div id="templateContainer"></div>
    </div>

</div>

<div id="tplModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Template</h3>
        <input type="hidden" id="editId">
        <label style="font-size:0.7rem; color:var(--primary);">NAMA TEMPLATE</label>
        <input type="text" id="tplTitle">
        <label style="font-size:0.7rem; color:var(--primary);">ISI PESAN</label>
        <textarea id="tplContent" style="height:100px;"></textarea>
        <div style="display:flex; gap:10px;">
            <button class="main-btn" onclick="saveTemplate()">Simpan</button>
            <button class="main-btn" style="background:#444; color:white;" onclick="closeModal()">Batal</button>
        </div>
    </div>
</div>

<script>
    const SB_URL = "https://sfqsomwgbflcszfjogkx.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmcXNvbXdnYmZsY3N6ZmpvZ2t4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwMjYzOTcsImV4cCI6MjA4MjYwMjM5N30.Az41UxJJdgf-WTRX0XpPHGE3TZ5d83B_qIVyrwoVxcg";
    const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };

    const bankNames = ["QRIS", "BCA", "BNI", "BRI", "DANAMON", "MANDIRI", "MAYBANK", "SEABANK", "JAGO", "BSI", "CIMB", "DANA", "LINKAJA", "OVO", "GOPAY", "USDT"];
    let bankStates = {};

    document.addEventListener('DOMContentLoaded', () => {
        initBanks();
        fetchLive();
        loadTemplates();
    });

    // --- BANK LOGIC ---
    function initBanks() {
        const container = document.getElementById('bankList');
        container.innerHTML = bankNames.map(name => {
            bankStates[name] = 'ONLINE';
            return `
            <div class="bank-row">
                <div class="bank-name">${name}</div>
                <div class="st-group">
                    <button class="st-btn btn-on active" id="on-${name}" onclick="setSt('${name}','ONLINE')">ON</button>
                    <button class="st-btn btn-off" id="off-${name}" onclick="setSt('${name}','OFFLINE')">OFF</button>
                    <button class="st-btn btn-ggn" id="ggn-${name}" onclick="setSt('${name}','GANGGUAN')">GGN</button>
                    <button class="st-btn btn-qris" id="qris-${name}" onclick="setSt('${name}','QRIS')">>QRIS</button>
                </div>
            </div>`;
        }).join('');
    }

    function setSt(name, st) {
        bankStates[name] = st;
        const map = {'ONLINE':'on','OFFLINE':'off','GANGGUAN':'ggn','QRIS':'qris'};
        ['on','off','ggn','qris'].forEach(p => document.getElementById(`${p}-${name}`).classList.remove('active'));
        document.getElementById(`${map[st]}-${name}`).classList.add('active');
    }

    function generateText() {
        let off = [], ggn = [], qris = [];
        for (let b in bankStates) {
            if (bankStates[b] === 'OFFLINE') off.push(b);
            else if (bankStates[b] === 'GANGGUAN') ggn.push(b);
            else if (bankStates[b] === 'QRIS') qris.push(`${b} > QRIS`);
        }
        let msg = "📢 STATUS LAYANAN: ";
        if (!off.length && !ggn.length && !qris.length) msg += "Semua Bank Online. Selamat Bertransaksi!";
        else {
            if (qris.length) msg += `[ ${qris.join(', ')} ] `;
            if (ggn.length) msg += `[ GANGGUAN: ${ggn.join(', ')} ] `;
            if (off.length) msg += `[ OFFLINE: ${off.join(', ')} ] `;
            msg += "Lainnya Normal.";
        }
        document.getElementById('marqueeInput').value = msg;
    }

    // --- LIVE UPDATE ---
    async function fetchLive() {
        const res = await fetch(`${SB_URL}/rest/v1/app_config?key=eq.marquee_text&select=value`, { headers: HEADERS });
        const data = await res.json();
        if (data.length) document.getElementById('marqueeInput').value = data[0].value;
    }

    async function updateLive() {
        const val = document.getElementById('marqueeInput').value;
        const res = await fetch(`${SB_URL}/rest/v1/app_config?key=eq.marquee_text`, { method:'PATCH', headers: HEADERS, body: JSON.stringify({value:val}) });
        if (res.ok) { 
            document.getElementById('statusLog').innerHTML = "<span style='color:var(--primary)'>✅ Update Berhasil!</span>";
            setTimeout(()=> document.getElementById('statusLog').innerText='', 2000);
        }
    }

    // --- TEMPLATE CRUD ---
    async function loadTemplates() {
        const res = await fetch(`${SB_URL}/rest/v1/marquee_templates?select=*&order=id.asc`, { headers: HEADERS });
        const data = await res.json();
        document.getElementById('templateContainer').innerHTML = data.map(t => `
            <div class="temp-item">
                <div class="temp-click" onclick="document.getElementById('marqueeInput').value='${t.content.replace(/'/g, "\\'")}'">
                    <b>${t.title}</b>
                    <p>${t.content}</p>
                </div>
                <div class="temp-actions">
                    <button class="btn-icon" onclick="openModal(${t.id}, '${t.title}', '${t.content.replace(/'/g, "\\'")}')">✏️</button>
                    <button class="btn-icon" onclick="delTpl(${t.id})">🗑️</button>
                </div>
            </div>
        `).join('');
    }

    function openModal(id=null, title='', content='') {
        document.getElementById('editId').value = id;
        document.getElementById('tplTitle').value = title;
        document.getElementById('tplContent').value = content;
        document.getElementById('modalTitle').innerText = id ? "Edit Template" : "Tambah Template";
        document.getElementById('tplModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('tplModal').style.display = 'none'; }

    async function saveTemplate() {
        const id = document.getElementById('editId').value;
        const title = document.getElementById('tplTitle').value;
        const content = document.getElementById('tplContent').value;
        if (!title || !content) return;

        const isEdit = id && id !== "null";
        const method = isEdit ? 'PATCH' : 'POST';
        const url = isEdit ? `${SB_URL}/rest/v1/marquee_templates?id=eq.${id}` : `${SB_URL}/rest/v1/marquee_templates`;

        const res = await fetch(url, { method, headers: HEADERS, body: JSON.stringify({title, content}) });
        if (res.ok) { closeModal(); loadTemplates(); }
    }

    async function delTpl(id) {
        if (!confirm("Hapus?")) return;
        await fetch(`${SB_URL}/rest/v1/marquee_templates?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
        loadTemplates();
    }
</script>
</body>
</html>
